services:
  mcp:
    build:
      context: .
    image: 11fgb-cleaning-tools:${MCP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /etc/11fgb-mcp.env
    ports:
      - "127.0.0.1:3400:3400"
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
