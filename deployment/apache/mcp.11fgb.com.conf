<VirtualHost *:80>
    ServerName mcp.11fgb.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3400/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:3400/

    ErrorLog ${APACHE_LOG_DIR}/mcp.11fgb.com-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp.11fgb.com-access.log combined
</VirtualHost>
