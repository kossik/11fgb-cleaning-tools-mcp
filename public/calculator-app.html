<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>11FGB Cleaning Estimate</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#152238}
    *{box-sizing:border-box}body{margin:0;padding:12px}.shell{max-width:760px;margin:auto}.empty{padding:24px;border:1px dashed #b9c4d4;border-radius:18px;text-align:center;color:#5c6b80;background:#fff}
  </style>
</head>
<body>
  <main class="shell"><div id="empty" class="empty">Preparing the visual estimate…</div><cleaning-calculation-result id="result"></cleaning-calculation-result></main>
  <script type="module" src="https://mcp.11fgb.com/ui/calculator-result.js"></script>
  <script>
    const resultElement = document.getElementById("result");
    const empty = document.getElementById("empty");
    function render(payload){
      const result = payload && payload.result ? payload.result : payload;
      if(!result || !result.headline) return;
      empty.hidden = true;
      resultElement.result = result;
    }
    window.addEventListener("message", (event) => {
      if(event.source !== window.parent || !event.data || event.data.jsonrpc !== "2.0") return;
      if(event.data.method === "ui/notifications/tool-result") render(event.data.params && event.data.params.structuredContent);
    }, {passive:true});
    if(window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
  </script>
</body>
</html>
